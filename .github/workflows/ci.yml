name: RedWolf CI / CD Quality Gate

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  backend-test:
    name: Backend Test Suite & Compilation (Go 1.23+)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: true

      - name: Download Go Dependencies
        run: go mod download

      - name: Run Unit Tests with Race Detector
        run: go test -v -race ./...

      - name: Build Core Daemon Binary
        run: CGO_ENABLED=0 go build -ldflags="-s -w" -o bin/redwolf ./cmd/redwolf

      - name: Build Discovery Agent Binary
        run: CGO_ENABLED=0 go build -ldflags="-s -w" -o bin/redwolf-discovery ./cmd/redwolf-discovery

  frontend-build:
    name: Frontend Build & Typecheck (React 19 + TypeScript)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install Frontend Dependencies
        run: npm ci

      - name: Typecheck and Build Dashboard Assets
        run: npm run build

  container-build:
    name: Production Appliance Container Build
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-build]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build Appliance Docker Image
        run: docker build -t redwolf:ci .
