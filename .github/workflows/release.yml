name: RedWolf Enterprise Release Pipeline

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v1.2.0)'
        required: true
        default: 'v1.2.0'

permissions:
  contents: write
  packages: write

jobs:
  build-discovery-ramfs:
    name: Package Alpine Discovery RAMdisk & Kernel
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Compile and Package In-Memory Discovery RAMdisk
        run: |
          chmod +x scripts/build-discovery-ramfs.sh scripts/init.sh
          ./scripts/build-discovery-ramfs.sh "${GITHUB_WORKSPACE}/assets/discovery"

      - name: Verify Generated Boot Artifacts
        run: |
          ls -lh assets/discovery/
          cat assets/discovery/SHA256SUMS

      - name: Archive Discovery Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: discovery-boot-assets
          path: assets/discovery/*
          if-no-files-found: error

  publish-github-release:
    name: Publish Official GitHub Release Assets
    runs-on: ubuntu-latest
    needs: build-discovery-ramfs
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download Discovery Boot Artifacts
        uses: actions/download-artifact@v4
        with:
          name: discovery-boot-assets
          path: assets/discovery

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            assets/discovery/vmlinuz
            assets/discovery/initramfs.img
            assets/discovery/SHA256SUMS
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-docker-hub:
    name: Build & Push Appliance to Docker Hub & GHCR
    runs-on: ubuntu-latest
    needs: [build-discovery-ramfs, publish-github-release]
    env:
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME || 'wolverandover' }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download Discovery Boot Artifacts
        uses: actions/download-artifact@v4
        with:
          name: discovery-boot-assets
          path: assets/discovery

      - name: Extract Tag or Version
        id: meta
        run: |
          if [ -n "${{ github.event.inputs.tag }}" ]; then
            RAW_TAG="${{ github.event.inputs.tag }}"
          else
            RAW_TAG="${GITHUB_REF_NAME}"
          fi
          VERSION="${RAW_TAG#v}"
          BUILD_DATE=$(date -u +'%Y-%m-%dT%H:%M:%SZ')
          echo "tag=${RAW_TAG}" >> $GITHUB_OUTPUT
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "build_date=${BUILD_DATE}" >> $GITHUB_OUTPUT

      - name: Determine Container Tags
        id: tags
        run: |
          TAGS="ghcr.io/tensordriftstudio/redwolf:${{ steps.meta.outputs.version }}
          ghcr.io/tensordriftstudio/redwolf:latest"
          if [ -n "${DOCKERHUB_TOKEN}" ]; then
            TAGS="${TAGS}
          wolverandover/redwolf:${{ steps.meta.outputs.version }}
          wolverandover/redwolf:latest"
          fi
          echo "tags<<EOF" >> $GITHUB_OUTPUT
          echo "${TAGS}" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Log in to Docker Hub
        if: env.DOCKERHUB_TOKEN != ''
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ env.DOCKERHUB_TOKEN }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Docker Appliance Images
        run: |
          BUILD_TAGS=()
          while IFS= read -r tag; do
            tag=$(echo "$tag" | xargs)
            [ -n "$tag" ] && BUILD_TAGS+=("-t" "$tag")
          done <<< "${{ steps.tags.outputs.tags }}"

          echo "Building Docker image with tags: ${BUILD_TAGS[*]}"
          docker build \
            --build-arg VERSION="v${{ steps.meta.outputs.version }}" \
            --build-arg GIT_COMMIT="${{ github.sha }}" \
            --build-arg BUILD_DATE="${{ steps.meta.outputs.build_date }}" \
            "${BUILD_TAGS[@]}" .

          echo "Pushing Docker images..."
          while IFS= read -r tag; do
            tag=$(echo "$tag" | xargs)
            if [ -n "$tag" ]; then
              echo "Pushing $tag..."
              docker push "$tag"
            fi
          done <<< "${{ steps.tags.outputs.tags }}"
