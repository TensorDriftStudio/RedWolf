# Macvlan Deployment Compose configuration
# Use when the Docker host runs on a shared network and you want RedWolf
# isolated on a dedicated physical interface/VLAN with its own MAC and IP.
services:
  redwolf:
    build:
      context: .
      dockerfile: Dockerfile
    image: redwolf:latest
    container_name: redwolf-core-macvlan
    restart: unless-stopped
    networks:
      provisioning_net:
        ipv4_address: 192.168.100.10
    cap_add:
      - NET_ADMIN
      - NET_BIND_SERVICE
      - NET_RAW
    environment:
      - REDWOLF_HTTP_PORT=8080
      - REDWOLF_PROVISIONING_INTERFACE=eth0
      - REDWOLF_IP=192.168.100.10
      - REDWOLF_DB_PATH=/var/lib/redwolf/db/redwolf.db
      - REDWOLF_IMAGE_DIR=/var/lib/redwolf/images
      - REDWOLF_TFTP_DIR=/var/lib/redwolf/tftp
    volumes:
      - ./data/db:/var/lib/redwolf/db
      - ./data/images:/var/lib/redwolf/images
      - ./data/tftp:/var/lib/redwolf/tftp
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

networks:
  provisioning_net:
    driver: macvlan
    driver_opts:
      parent: eth1  # Replace with the physical host interface connected to the provisioning switch
    ipam:
      config:
        - subnet: 192.168.100.0/24
          gateway: 192.168.100.1
