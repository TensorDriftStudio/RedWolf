# ==============================================================================
# RedWolf Development Environment Compose Configuration
# ==============================================================================
# Use this compose file for active development when working on the frontend
# with instant Hot Module Replacement (HMR) without installing Node/npm on the host.
#
# Usage:
#   docker compose -f docker-compose.dev.yml up --build
#
# Access:
#   - Frontend (Vite Dev with HMR): http://localhost:5173
#   - Backend Engine API:           http://localhost:8080
# ==============================================================================

services:
  redwolf:
    build:
      context: .
      dockerfile: Dockerfile
    image: redwolf:latest
    container_name: redwolf-backend-dev
    restart: unless-stopped
    network_mode: host
    cap_add:
      - NET_ADMIN
      - NET_BIND_SERVICE
      - NET_RAW
    environment:
      - REDWOLF_HTTP_PORT=8080
      - REDWOLF_PROVISIONING_INTERFACE=eth0
      - REDWOLF_DB_PATH=/var/lib/redwolf/db/redwolf.db
      - REDWOLF_IMAGE_DIR=/var/lib/redwolf/images
      - REDWOLF_TFTP_DIR=/var/lib/redwolf/tftp
    volumes:
      - ./data/db:/var/lib/redwolf/db
      - ./data/images:/var/lib/redwolf/images
      - ./data/tftp:/var/lib/redwolf/tftp
      - ./assets:/usr/share/redwolf/assets:ro
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

  redwolf-ui:
    build:
      context: ./web
      dockerfile: Dockerfile.dev
    image: redwolf-ui:dev
    container_name: redwolf-ui-dev
    restart: unless-stopped
    network_mode: host
    environment:
      - VITE_BACKEND_URL=http://127.0.0.1:8080
    volumes:
      - ./web:/app
      - /app/node_modules
    depends_on:
      - redwolf
